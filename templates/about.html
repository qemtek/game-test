<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .about-container {
            width: 100%;
            max-width: 600px;
        }

        .about-section {
            margin-bottom: 2rem;
        }

        .about-section h2 {
            color: #4ade80;
            font-size: 1.4rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            border-bottom: 1px solid #2d2d4e;
            padding-bottom: 0.5rem;
        }

        .about-table {
            width: 100%;
            border-collapse: collapse;
        }

        .about-table th,
        .about-table td {
            padding: 0.5rem 1rem;
            text-align: left;
            border-bottom: 1px solid #2d2d4e;
            font-size: 0.9rem;
        }

        .about-table th {
            color: #6b7280;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            width: 40%;
        }

        .about-table td {
            color: #e0e0e0;
        }


    </style>
</head>
<body>
    <h1>About</h1>
    <nav class="site-nav">
        <a href="/" class="nav-link{% if endpoint == 'index' %} active{% endif %}">Home</a>
        <a href="/scoreboard" class="nav-link{% if endpoint == 'scoreboard' %} active{% endif %}">Scoreboard</a>
        <a href="/history" class="nav-link{% if endpoint == 'history_page' %} active{% endif %}">History</a>
        <a href="/streaks" class="nav-link{% if endpoint == 'streaks_page' %} active{% endif %}">Streaks</a>
        <a href="/badges" class="nav-link{% if endpoint == 'badges_page' %} active{% endif %}">Badges</a>
        <a href="/achievements" class="nav-link{% if endpoint == 'achievements_page' %} active{% endif %}">Achievements</a>
        <a href="/stats" class="nav-link{% if endpoint == 'stats_page' %} active{% endif %}">Stats</a>
        <a href="/about" class="nav-link{% if endpoint == 'about_page' %} active{% endif %}">About</a>
    </nav>

    <div class="about-container">
        <div class="about-section">
            <h2>App Info</h2>
            <table class="about-table">
                <tbody>
                    <tr>
                        <th>App Name</th>
                        <td>{{ name }}</td>
                    </tr>
                    <tr>
                        <th>Version</th>
                        <td>{{ version }}</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="about-section">
            <h2>Stats</h2>
            <table class="about-table">
                <tbody>
                    <tr>
                        <th>Total Unique Players</th>
                        <td>{{ total_players }}</td>
                    </tr>
                    <tr>
                        <th>Total Scores Submitted</th>
                        <td>{{ total_scores }}</td>
                    </tr>
                    <tr>
                        <th>Total Tournaments Created</th>
                        <td>{{ total_tournaments }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
