<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .about-container {
            width: 100%;
            max-width: 600px;
        }

        .about-section {
            margin-bottom: 2rem;
        }

        .about-section h2 {
            color: #4ade80;
            font-size: 1.4rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            border-bottom: 1px solid #2d2d4e;
            padding-bottom: 0.5rem;
        }

        .about-table {
            width: 100%;
            border-collapse: collapse;
        }

        .about-table th,
        .about-table td {
            padding: 0.5rem 1rem;
            text-align: left;
            border-bottom: 1px solid #2d2d4e;
            font-size: 0.9rem;
        }

        .about-table th {
            color: #6b7280;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            width: 40%;
        }

        .about-table td {
            color: #e0e0e0;
        }

        a.nav-link {
            color: #4ade80;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        a.nav-link:hover {
            color: #86efac;
        }

        .build-stamp {
            color: #6b7280;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <h1>About</h1>
    <p class="subtitle"><a href="/" class="nav-link">← Back to Game</a></p>

    <div class="about-container">
        <div class="about-section">
            <h2>App Info</h2>
            <table class="about-table">
                <tbody>
                    <tr>
                        <th>App Name</th>
                        <td>{{ name }}</td>
                    </tr>
                    <tr>
                        <th>Version</th>
                        <td>{{ version }}</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="about-section">
            <h2>Stats</h2>
            <table class="about-table">
                <tbody>
                    <tr>
                        <th>Total Unique Players</th>
                        <td>{{ total_players }}</td>
                    </tr>
                    <tr>
                        <th>Total Scores Submitted</th>
                        <td>{{ total_scores }}</td>
                    </tr>
                    <tr>
                        <th>Total Tournaments Created</th>
                        <td>{{ total_tournaments }}</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="about-section">
            <p class="build-stamp">© {{ current_year }} Game Score Tracker</p>
        </div>
    </div>
</body>
</html>
