{% extends "base.html" %}

{% block title %}Snake{% endblock %}

{% block content %}
    <h1>Snake</h1>
    <p class="subtitle">Use arrow keys or WASD</p>

    <div class="game-container">
        <div class="game-panel">
            <div class="hud">
                <div class="hud-item">
                    <div class="hud-label">Score</div>
                    <div class="hud-value" id="score">0</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">Best</div>
                    <div class="hud-value" id="high-score">0</div>
                </div>
                <div class="hud-item">
                    <div class="hud-label">Length</div>
                    <div class="hud-value" id="length">3</div>
                </div>
            </div>

            <div class="canvas-wrapper">
                <canvas id="game-canvas" width="400" height="400"></canvas>

                <div class="game-over-overlay" id="game-over-overlay" style="display:none;">
                    <h2>Game Over</h2>
                    <div class="final-score" id="final-score">Score: 0</div>
                    <input
                        type="text"
                        id="player-name"
                        class="name-input"
                        placeholder="Enter your name"
                        maxlength="20"
                    >
                    <button onclick="submitScore()">Submit Score</button>
                    <button onclick="hideOverlay(); startGame();">Play Again</button>
                </div>
            </div>

            <div class="controls">
                <button id="start-btn" onclick="startGame()">Start</button>
            </div>
            <div class="game-message" id="game-message"></div>
        </div>

        <div class="leaderboard-panel">
            <h2>Leaderboard</h2>
            <table class="leaderboard-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <tr>
                        <td colspan="3" class="empty-state">No scores yet</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <p style="text-align:center; margin-top:1rem;"><a href="/history" style="color:#4ade80; text-decoration:none; font-family:'Courier New',monospace; font-size:0.85rem; letter-spacing:2px; text-transform:uppercase;">&#9654; History</a></p>
    <script src="/static/game.js"></script>
{% endblock %}
