<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game History</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .history-container {
            width: 100%;
            max-width: 800px;
        }

        .history-section {
            margin-bottom: 2rem;
        }

        .history-section h2 {
            color: #4ade80;
            font-size: 1.4rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            border-bottom: 1px solid #2d2d4e;
            padding-bottom: 0.5rem;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
        }

        .history-table th,
        .history-table td {
            padding: 0.5rem 1rem;
            text-align: left;
            border-bottom: 1px solid #2d2d4e;
            font-size: 0.9rem;
        }

        .history-table th {
            color: #6b7280;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .history-table td {
            color: #e0e0e0;
        }

        .history-table td:first-child {
            color: #4ade80;
            font-weight: bold;
        }

        .empty-state {
            color: #6b7280;
            text-align: center;
            padding: 1rem;
        }

        .empty-card {
            background: #1a1a2e;
            border: 1px solid #2d2d4e;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            margin-top: 1rem;
        }

        .empty-card-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .empty-card p {
            color: #6b7280;
            margin: 0.5rem 0;
        }

        .empty-card p:first-of-type {
            color: #4ade80;
            font-family: monospace;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        a.nav-link {
            color: #4ade80;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        a.nav-link:hover {
            color: #86efac;
        }
    </style>
</head>
<body>
    <h1>Game History</h1>
    <p class="subtitle"><a href="/" class="nav-link">← Back to Game</a></p>

    <div class="history-container">
        <div class="history-section">
            <h2>Recent Games</h2>
            {% if entries %}
            <table class="history-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Score</th>
                        <th>When</th>
                    </tr>
                </thead>
                <tbody>
                    {% for entry in entries %}
                    <tr>
                        <td>{{ entry.rank }}</td>
                        <td>{{ entry.name }}</td>
                        <td>{{ entry.score }}</td>
                        <td>{{ entry.time_ago }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            {% else %}
            <div class="empty-card">
                <div class="empty-card-icon">🎮</div>
                <p>No games played yet</p>
                <p>Start a game and your scores will appear here</p>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
